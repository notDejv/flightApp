name: FlightApp
options:
  bundleIdPrefix: com.dejv
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    GENERATE_INFOPLIST_FILE: YES
    DEVELOPMENT_TEAM: 7X2DPYK2TT
    CODE_SIGN_STYLE: Automatic
targets:
  FlightApp:
    type: application
    platform: iOS
    sources:
      - FlightApp
      - path: FlightWidget/FlightActivityAttributes.swift
    info:
      path: FlightApp/Info.plist
      properties:
        # Solid sky color so the system launch screen blends into the animated splash.
        UILaunchScreen:
          UIColorName: LaunchBackground
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dejv.flightApp
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_NSSupportsLiveActivities: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_CFBundleDisplayName: Wingly
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - target: FlightWidget
  FlightWidget:
    type: app-extension
    platform: iOS
    sources:
      - FlightWidget
    info:
      path: FlightWidget/Info.plist
      properties:
        CFBundleDisplayName: Wingly
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dejv.flightApp.widget
        GENERATE_INFOPLIST_FILE: NO
  FlightAppTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - FlightAppTests
    dependencies:
      - target: FlightApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dejv.flightApp.tests
schemes:
  FlightApp:
    build:
      targets:
        FlightApp: all
    test:
      targets:
        - FlightAppTests
